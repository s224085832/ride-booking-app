<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Request a Ride</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <div id="user-bar">
        <span id="user-info"></span>
        <button id="logout-btn">Log out</button>
      </div>
      <h1>RideBook</h1>
      <button id="history-toggle-btn">📜 Ride History</button>

      <div id="booking-view">
                <p class="instruction">Search for your pickup and destination, or click the map to set them</p>

        <div id="search-card">
          <div class="search-field">
            <label>Current location</label>
            <div class="search-input-row">
              <input type="text" id="pickup-input" placeholder="Enter pickup location" autocomplete="off">
              <button type="button" id="use-location-btn" title="Use my current location">📍</button>
            </div>
            <ul class="suggestions" id="pickup-suggestions"></ul>
          </div>

          <div id="stops-container"></div>

          <button type="button" id="add-stop-btn">+ Add Stop</button>

          <div class="search-field">
            <label>Where to?</label>
            <input type="text" id="dropoff-input" placeholder="Enter destination" autocomplete="off">
            <ul class="suggestions" id="dropoff-suggestions"></ul>
          </div>

          <div id="ride-controls" class="hidden">
            <p id="fare-estimate" class="fare-estimate"></p>

            <div id="payment-toggle">
              <button type="button" class="payment-btn active" data-method="cash">💵 Cash</button>
              <button type="button" class="payment-btn" data-method="card">💳 Card</button>
            </div>

            <div id="card-fields" class="hidden">
              <input type="text" id="card-number-input" placeholder="Card number" maxlength="19" autocomplete="off">
              <div class="card-fields-row">
                <input type="text" id="card-expiry-input" placeholder="MM/YY" maxlength="5" autocomplete="off">
                <input type="text" id="card-cvv-input" placeholder="CVV" maxlength="3" autocomplete="off">
              </div>
              <p class="card-note">This is a mock form for demo purposes — no real card data is sent or stored.</p>
            </div>

            <button id="request-btn">Request Ride</button>
            <button id="reset-btn">Reset</button>
          </div>
        </div>
        <p id="search-error" class="login-error"></p>

        <div id="active-ride-section">
          <h2>Active Ride</h2>
          <ul id="active-rides-list"></ul>
        </div>
      </div>

      <div id="history-panel" class="hidden">
        <button id="close-history-btn">&larr; Back to booking</button>
        <h2>Ride History</h2>
        <ul id="history-rides-list"></ul>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <!-- Cancel-reason modal -->
  <div id="cancel-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Cancel this ride?</h2>
      <label for="cancel-reason-select">Reason for cancelling</label>
      <select id="cancel-reason-select">
        <option value="">Select a reason</option>
        <option value="Changed my mind">Changed my mind</option>
        <option value="Driver taking too long">Driver taking too long</option>
        <option value="Found another ride">Found another ride</option>
        <option value="Entered wrong location">Entered wrong location</option>
        <option value="Price too high">Price too high</option>
        <option value="Other">Other</option>
      </select>
      <div class="modal-actions">
        <button id="cancel-modal-back-btn">Never mind</button>
        <button id="cancel-modal-confirm-btn">Confirm Cancellation</button>
      </div>
      <p id="cancel-modal-error" class="login-error"></p>
    </div>
  </div>

  <!-- Chat modal -->
  <div id="chat-modal" class="modal-overlay hidden">
    <div class="modal-card chat-card">
      <div class="chat-header">
        <h2>Chat with your driver</h2>
        <button id="chat-close-btn" class="chat-close-btn">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="chat-send-btn">Send</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
