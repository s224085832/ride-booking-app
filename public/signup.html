<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-page">
    <div id="login-card">
      <h1>RideBook</h1>
      <p class="instruction">Create your account</p>

      <form id="signup-form">
        <input type="text" id="signup-name-input" placeholder="Full name" autocomplete="name">
        <input type="text" id="signup-username-input" placeholder="Choose a username" autocomplete="username">
        <input type="password" id="signup-password-input" placeholder="Choose a password" autocomplete="new-password">
        <div id="role-toggle">
          <button type="button" class="role-btn active" data-role="rider">Rider</button>
          <button type="button" class="role-btn" data-role="driver">Driver</button>
        </div>
        <button type="submit" id="signup-btn">Create Account</button>
      </form>

      <p id="form-error" class="login-error"></p>

      <p id="toggle-mode">
        Already have an account? <a href="index.html">Log in</a>
      </p>
    </div>
  </div>
  <script src="signup.js"></script>
</body>
</html>
