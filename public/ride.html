<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Request a Ride</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h1>RideBook</h1>
      <div id="user-bar">
        <span id="user-info"></span>
        <button id="logout-btn">Log out</button>
      </div>
      <p class="instruction" id="instruction">Click the map to set your pickup location</p>
      <div id="ride-controls" class="hidden">
  <p id="fare-estimate" class="fare-estimate"></p>
  <button id="request-btn">Request Ride</button>
  <button id="reset-btn">Reset</button>
</div>
      <div class="tabs">
        <button id="tab-active" class="tab-btn active">Active</button>
        <button id="tab-history" class="tab-btn">History</button>
      </div>
      <ul id="rides-list"></ul>
    </div>
    <div id="map"></div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
