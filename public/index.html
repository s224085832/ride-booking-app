<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideBook - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-page">
    <div id="login-card">
      <h1>RideBook</h1>
      <p class="instruction" id="form-subtitle">Sign in to continue</p>

      <!-- Login form -->
      <form id="login-form">
        <input type="text" id="username-input" placeholder="Username" autocomplete="username">
        <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
        <button type="submit" id="login-btn">Log In</button>
      </form>

      <!-- Sign-up form, hidden by default -->
      <form id="signup-form" class="hidden">
        <input type="text" id="signup-name-input" placeholder="Full name" autocomplete="name">
        <input type="text" id="signup-username-input" placeholder="Choose a username" autocomplete="username">
        <input type="password" id="signup-password-input" placeholder="Choose a password" autocomplete="new-password">
        <div id="role-toggle">
          <button type="button" class="role-btn active" data-role="rider">Rider</button>
          <button type="button" class="role-btn" data-role="driver">Driver</button>
        </div>
        <button type="submit" id="signup-btn">Create Account</button>
      </form>

      <p id="form-error" class="login-error"></p>

      <p id="toggle-mode">
        <span id="show-signup">Don't have an account? <a href="#">Sign up</a></span>
        <span id="show-login" class="hidden">Already have an account? <a href="#">Log in</a></span>
      </p>

      <div id="demo-accounts">
        <p class="demo-title">Demo accounts</p>
        <p>Rider: rider1 / rider123</p>
        <p>Driver: driver1 / driver123</p>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
